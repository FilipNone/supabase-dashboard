# The dashboard's OpenID Connect client and a synthetic operator. Applied by
# setup.sh. The redirect URI matches the dashboard's local development URL,
# SUPABASE_DASHBOARD_PUBLIC_URL=http://dash.localhost:3000.
version: 1
metadata:
  name: supabase-dashboard fixture
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: supabase-dashboard
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Recent Authentik versions allow only the grant types listed here.
      grant_types: [authorization_code]
      client_id: supabase-dashboard-fixture
      client_secret: fixture-only-client-secret
      redirect_uris:
        - matching_mode: strict
          url: http://dash.localhost:3000/auth/oidc/callback
      # Signing out of Authentik ends the dashboard sessions it started.
      # The worker posts here; docker-compose.yml points dash.localhost at
      # the Docker host.
      logout_uri: http://dash.localhost:3000/auth/oidc/backchannel-logout
      logout_method: backchannel
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers:
      slug: supabase-dashboard
    attrs:
      name: Supabase Dashboard
      provider: !KeyOf provider
  - model: authentik_core.user
    identifiers:
      username: operator
    attrs:
      name: Fixture Operator
      email: operator@example.test
      password: fixture-only-operator-password
