name: Release

# Pushing a tag `v<workspace version>` builds the container image for amd64
# and arm64, publishes it to GHCR, and creates a GitHub release with the
# Docker deploy bundle and prebuilt Linux tarballs. Tags with a `-` suffix
# (for example v0.1.0-dev.1) are marked as pre-releases and tagged `dev`
# instead of `latest`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/filipnone/supabase-dashboard

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml and the deploy bundle
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          if ! grep -qx "SUPABASE_DASHBOARD_VERSION=$version" deploy/.env.example; then
            echo "deploy/.env.example does not default to $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  image:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: x86_64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=supabase-dashboard
            org.opencontainers.image.description=Self-hosted dashboard for managing self-hosted Supabase deployments
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export binary and site
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dist
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Package Linux tarball
        run: |
          name="supabase-dashboard-${VERSION}-${{ matrix.arch }}-linux-gnu"
          mkdir -p "out/$name"
          cp -r dist/. "out/$name/"
          chmod 0755 "out/$name/supabase-dashboard-server"
          tar -C out -czf "$name.tar.gz" "$name"
      - name: Record digest
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: supabase-dashboard-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  manifest:
    needs: [check, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        working-directory: digests
        run: |
          channel=latest
          if [ "$PRERELEASE" = "true" ]; then channel=dev; fi
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.description=Self-hosted dashboard for managing self-hosted Supabase deployments" \
            --annotation "index:org.opencontainers.image.licenses=MIT OR Apache-2.0" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$channel" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    needs: [check, manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: linux-*
          merge-multiple: true
      - name: Package the Docker deploy bundle
        run: |
          name="supabase-dashboard-${VERSION}-docker"
          mkdir -p "bundle/$name"
          cp deploy/compose.yaml deploy/Caddyfile deploy/.env.example "bundle/$name/"
          cp docs/deployment.md "bundle/$name/README.md"
          cp LICENSE-MIT LICENSE-APACHE "bundle/$name/"
          tar -C bundle -czf "assets/$name.tar.gz" "$name"
          (cd assets && sha256sum -- *.tar.gz > SHA256SUMS)
          cat assets/SHA256SUMS
      - name: Create the GitHub release
        run: |
          cat > notes.md <<EOF
          Container image (linux/amd64, linux/arm64):

          \`\`\`
          docker pull $IMAGE:$VERSION
          \`\`\`

          To deploy on a Linux server with Docker, download \`supabase-dashboard-$VERSION-docker.tar.gz\`, unpack it, and follow its README. Nothing is compiled on the server.

          The \`*-linux-gnu.tar.gz\` files contain the same server binary and web assets for running without Docker (glibc 2.36 or newer).
          EOF
          if [ "$PRERELEASE" = "true" ]; then
            cat >> notes.md <<EOF

          This is a development pre-release. Expect breaking changes between dev releases. Database migrations only move forward: back up the metadata database before upgrading, and do not downgrade.
          EOF
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "supabase-dashboard $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
