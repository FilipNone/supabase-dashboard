name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUPABASE_DASHBOARD_TEST_DATABASE_URL: postgres://dashboard:ci-only@127.0.0.1:5432/dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy (server)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (browser WASM)
        run: cargo clippy -p supabase-dashboard-web --target wasm32-unknown-unknown --features hydrate --locked -- -D warnings
      - name: No server-only crates in the browser build
        run: |
          if cargo tree -p supabase-dashboard-web --target wasm32-unknown-unknown --features hydrate -e normal \
              | grep -E '(^|[^a-z_-])(sqlx|axum|argon2|reqwest|supabase-dashboard-persistence|supabase-dashboard-application|supabase-dashboard-adapters|tokio) v'; then
            echo "server-only dependency found in the hydrate build" >&2
            exit 1
          fi
      - name: Test
        run: cargo test --workspace --locked

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # wasm-bindgen must match Cargo.lock (the Dockerfile checks this).
          tool: cargo-leptos@0.3.11,wasm-bindgen@0.2.130
      # cargo-leptos uses wasm-bindgen and wasm-opt from PATH and downloads
      # them itself only when they are missing; those downloads have failed
      # CI before. Keep the Binaryen version and checksum in step with the
      # Dockerfile.
      - name: Install wasm-opt (Binaryen 123)
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/binaryen.tar.gz" \
            https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz
          echo "e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/binaryen"
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP/binaryen" --strip-components=1
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/binaryen/bin/wasm-opt" --version
      - name: Build server and WASM bundle
        run: cargo leptos build --release

  fixture:
    runs-on: ubuntu-latest
    # The dashboard's own metadata database, separate from the fixture's.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable Supabase fixture
        run: |
          docker compose -f tests/fixtures/supabase/docker-compose.yml \
            --env-file tests/fixtures/supabase/fixture.env -p sd-fixture up -d --wait --wait-timeout 300
      - name: Probe service endpoints
        run: |
          curl -fsS http://127.0.0.1:54399/health
          curl -fsS -o /dev/null http://127.0.0.1:54330/
          curl -fsS -o /dev/null http://127.0.0.1:54380/
          # The gateway refuses requests without a key.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/auth/v1/health)" = 401
          # Studio sits behind the gateway's basic-auth catch-all route.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/project/default)" = 401
          # Realtime's tenant administration stays closed at the gateway.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/realtime/v1/api/tenants)" = 403
          # The same through upstream's Envoy gateway.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54323/auth/v1/health)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54323/project/default)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54323/realtime/v1/api/tenants)" = 403
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Adapter tests against the fixture
        env:
          SUPABASE_DASHBOARD_TEST_FIXTURE_URL: http://127.0.0.1:54321
        run: cargo test -p supabase-dashboard-adapters --locked
      - name: Open the fixture's Studio through the dashboard
        env:
          SUPABASE_DASHBOARD_TEST_FIXTURE_URL: http://127.0.0.1:54321
          SUPABASE_DASHBOARD_TEST_DATABASE_URL: postgres://dashboard:ci-only@127.0.0.1:5432/dashboard
        run: cargo test -p supabase-dashboard-server --locked studio_opens_the_fixture_studio
      # Envoy also translates the opaque sb_ keys; Kong runs in legacy key mode.
      - name: Adapter tests through the Envoy gateway
        env:
          SUPABASE_DASHBOARD_TEST_FIXTURE_URL: http://127.0.0.1:54323
          SUPABASE_DASHBOARD_TEST_FIXTURE_NEW_KEYS_URL: http://127.0.0.1:54323
        run: cargo test -p supabase-dashboard-adapters --locked --test gateway_fixture
      - name: Open the fixture's Studio and check the new keys through the Envoy gateway
        env:
          SUPABASE_DASHBOARD_TEST_FIXTURE_URL: http://127.0.0.1:54323
          SUPABASE_DASHBOARD_TEST_FIXTURE_NEW_KEYS_URL: http://127.0.0.1:54323
          SUPABASE_DASHBOARD_TEST_DATABASE_URL: postgres://dashboard:ci-only@127.0.0.1:5432/dashboard
        run: >-
          cargo test -p supabase-dashboard-server --locked --
          studio_opens_the_fixture_studio the_new_api_keys_pass_a_fixture_check
      - name: Show logs on failure
        if: failure()
        run: docker compose -p sd-fixture logs --no-color --tail 100
      - name: Tear down
        if: always()
        run: docker compose -p sd-fixture down -v

  dokploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Dokploy runs in a swarm inside a Docker-in-Docker container, so the
      # runner's own Docker stays out of swarm mode.
      - name: Start disposable Dokploy fixture
        run: |
          docker compose -f tests/fixtures/dokploy/docker-compose.yml up -d --wait --wait-timeout 120
          tests/fixtures/dokploy/setup.sh
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Dokploy client tests against the fixture
        env:
          SUPABASE_DASHBOARD_TEST_DOKPLOY_URL: http://127.0.0.1:54340
        run: cargo test -p supabase-dashboard-adapters --locked --test dokploy_fixture
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f tests/fixtures/dokploy/docker-compose.yml exec -T docker \
            docker service logs --tail 100 dokploy || true
          docker compose -f tests/fixtures/dokploy/docker-compose.yml logs --no-color --tail 50
      - name: Tear down
        if: always()
        run: docker compose -f tests/fixtures/dokploy/docker-compose.yml down -v
