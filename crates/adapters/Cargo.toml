[package]
name = "supabase-dashboard-adapters"
description = "Outbound connections to self-hosted Supabase services for supabase-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
supabase-dashboard-application.workspace = true
supabase-dashboard-domain.workspace = true
bytes = "1"
futures-core = "0.3"
http.workspace = true
# No default features: TLS comes from the preconfigured rustls config below,
# with the ring provider, instead of reqwest's aws-lc-rs default.
# `stream` lets Studio request bodies flow through without buffering.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
# Fingerprints of the certificates a project trusts, shown to operators.
sha2 = "0.11"
thiserror.workspace = true
# Reads the RFC 3339 times in Dokploy's answers.
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["net", "time"] }
tracing.workspace = true
url.workspace = true
webpki-roots = "1"
# Reads the expiry of the certificate a gateway presents. No default
# features: nothing is verified with it.
x509-parser = { version = "0.18", default-features = false }

[dev-dependencies]
axum.workspace = true
# Signs an expired key with the fixture's JWT secret.
base64 = "0.22"
hmac = "0.13"
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[lints]
workspace = true
