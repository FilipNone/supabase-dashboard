[package]
name = "supabase-dashboard-web"
description = "Leptos browser UI for supabase-dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
supabase-dashboard-domain.workspace = true
console_error_panic_hook = { workspace = true, optional = true }
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
serde.workspace = true
thiserror.workspace = true
time.workspace = true
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { version = "0.3", optional = true, features = ["HtmlDocument", "History", "Location"] }
http = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
# Server-only: compiled into the SSR build, never into the WASM bundle.
supabase-dashboard-application = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen", "dep:web-sys"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:http",
    "dep:leptos_axum",
    "dep:supabase-dashboard-application",
    "dep:secrecy",
    "dep:tracing",
]

[lints]
workspace = true
