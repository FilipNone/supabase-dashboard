# Runs supabase-dashboard on one Linux server from the prebuilt image.
# Setup is in README.md in this bundle (docs/deployment.md in the repository).
#
#   cp .env.example .env    # then edit .env
#   create secret.key        # see "Install" in README.md
#   docker compose up -d                    # behind your own HTTPS proxy
#   docker compose --profile caddy up -d    # or with the bundled Caddy for TLS
#
# The metadata database lives in the `db-data` volume. `docker compose down`
# keeps it; `docker compose down -v` deletes it.
name: supabase-dashboard

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_DB: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    # The port is not published on the host, so only containers in this
    # project can reach the database.

  dashboard:
    image: ghcr.io/filipnone/supabase-dashboard:${SUPABASE_DASHBOARD_VERSION:?set SUPABASE_DASHBOARD_VERSION in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Passes SUPABASE_DASHBOARD_* settings (and RUST_LOG) through to the server.
    env_file: .env
    environment:
      SUPABASE_DASHBOARD_DATABASE_URL: postgres://dashboard:${POSTGRES_PASSWORD}@db:5432/dashboard
      SUPABASE_DASHBOARD_SECRET_KEY_FILE: /run/secrets/secret_key
    secrets:
      # Encrypts the API keys of managed stacks. Back it up separately from
      # the database: without it, stored keys cannot be read.
      - secret_key
    ports:
      # Loopback only by default; put an HTTPS reverse proxy in front.
      - "${SUPABASE_DASHBOARD_BIND:-127.0.0.1}:${SUPABASE_DASHBOARD_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - dashboard
    environment:
      SUPABASE_DASHBOARD_DOMAIN: ${SUPABASE_DASHBOARD_DOMAIN:-}
      # `studio.invalid` stands for "no Studio hosts"; nothing is obtained for it.
      SUPABASE_DASHBOARD_STUDIO_DOMAIN: ${SUPABASE_DASHBOARD_STUDIO_DOMAIN:-studio.invalid}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

secrets:
  secret_key:
    file: ./secret.key

volumes:
  db-data:
  caddy-data:
  caddy-config:
